<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIKENESS</title>
<style>
:root{--ink:#ecebe8;--dim:#8b8e94;--ui:#0e0f12;--ui2:#18191d;--ui3:#222429;--line:#26292e;--cy:#a6ecff;--red:#ff5a4a;--amber:#ffbf7a;--blue:#2f6bf0;
--serif:Georgia,"Noto Serif","Droid Serif","Times New Roman",serif;--mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
#app{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%}
#os{position:absolute;inset:0;display:flex;flex-direction:column;transition:filter .8s,opacity .8s}
#sb{flex:none;height:calc(30px + var(--sat));padding:var(--sat) 20px 0;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.02em;position:relative;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#sb .r{display:flex;gap:7px;align-items:center}
#sb svg{width:15px;height:15px;fill:currentColor}
#bat{display:inline-flex;align-items:center;gap:4px}
#scr{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scrIn .35s ease-out}
@keyframes scrIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#cine{position:absolute;inset:0;z-index:40;display:none;background:#000;overflow:hidden;touch-action:none}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}
#banner{position:absolute;left:10px;right:10px;top:calc(8px + var(--sat));z-index:55;pointer-events:none}
.bn{background:rgba(32,34,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:bnIn .45s cubic-bezier(.2,.9,.3,1.2);margin-bottom:6px}
.bn.out{animation:bnOut .35s ease-in forwards}
@keyframes bnIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes bnOut{to{transform:translateY(-120%);opacity:0}}
.ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.ic svg{width:60%;height:60%;fill:#fff}
.bn .t{font-size:13px;color:#bfc2c8;display:flex;justify-content:space-between;gap:8px}
.bn .t b{color:#fff;font-weight:600}
.bn .m{font-size:14.5px;margin-top:1px;color:#f2f2f2}
#thought{position:absolute;left:0;right:0;bottom:0;top:0;z-index:58;display:none;align-items:flex-end;justify-content:center;padding:0 18px calc(30px + var(--sab));background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 35%,rgba(0,0,0,0) 70%)}
#thought.on{display:flex}
#thought.free{pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0) 40%)}
#thought .tx{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:#ddd8cf;max-width:560px;width:100%;text-shadow:0 2px 12px #000;min-height:3em}
#thought .tx .c{opacity:0;transition:opacity .25s}
#thought .tx .c.v{opacity:1}
#thought .go{position:absolute;bottom:calc(10px + var(--sab));left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:#666;font-family:var(--mono);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.25}}
/* lock */
.lock{align-items:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.lock .clk{font-size:84px;font-weight:200;letter-spacing:-.02em;margin-top:5vh;line-height:1;font-variant-numeric:tabular-nums}
.lock .dt{font-size:17px;font-weight:500;opacity:.9;margin-top:6px}
.lock .nl{width:100%;flex:1;overflow-y:auto;padding:22px 10px 10px;display:flex;flex-direction:column;gap:7px;-webkit-mask:linear-gradient(to bottom,transparent,#000 18px)}
.lock .nl .bn{animation:nIn .5s ease-out;margin:0;text-shadow:none;background:rgba(28,30,36,.78)}
@keyframes nIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.lock .nl .bn.pulse{animation:npulse 1.2s infinite;box-shadow:0 0 0 2px var(--amber)}
@keyframes npulse{50%{box-shadow:0 0 0 2px rgba(255,191,122,.15)}}
.lock .hint{padding:14px 0 calc(16px + var(--sab));font-size:13px;letter-spacing:.06em;opacity:.75;animation:pulse 2.4s infinite}
.lock .bar{width:130px;height:5px;border-radius:3px;background:#fff;opacity:.8;margin-bottom:calc(8px + var(--sab))}
.kp{align-items:center;background:rgba(6,6,8,.9)}
.kp .lbl{margin-top:7vh;font-size:18px}
.kp .sub{font-size:12.5px;color:#aaa;margin-top:5px;text-align:center;padding:0 30px;min-height:2.4em}
.kp .dots{display:flex;gap:16px;margin:20px 0 26px}
.kp .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;transition:background .08s,transform .12s}
.kp .dots i.f{background:#fff;transform:scale(1.15);box-shadow:0 0 10px rgba(255,255,255,.6);animation:dotin .15s ease-out}
@keyframes dotin{from{transform:scale(.6)}}
.kp .dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.kp .keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.kp .keys button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:31px;font-weight:300;line-height:1}
.kp .keys button small{font-size:9.5px;letter-spacing:.2em;font-weight:600;margin-top:2px;opacity:.8}
.kp .keys button{touch-action:none}
.kp .keys button{transition:background .15s}
.kp .keys button.ghost{background:none;font-size:15px}
/* home */
.home{padding:10px 18px 0}
.wid{border-radius:22px;padding:16px 18px;background:linear-gradient(135deg,#fbf8ff,#ffeee6);color:#24212e;box-shadow:0 10px 40px rgba(180,160,255,.18);margin-top:8px}
.wid .h{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a78c9;text-transform:uppercase}
.wid .b{font-size:21px;font-weight:600;margin-top:4px}
.wid .s{font-size:13px;color:#6c6878;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;margin-top:28px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#e9e9e9;position:relative}
.app .ic{width:60px;height:60px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.app.off{opacity:.38}
.app .badge{position:absolute;top:-5px;right:calc(50% - 38px);background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid #000}
.app.wob .ic{animation:wob 1.6s infinite}
@keyframes wob{0%,100%{transform:none}10%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}30%{transform:none}}
.app.nope{animation:shake .4s}
/* app chrome */
.appv{background:var(--ui)}
.hd{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px 10px;border-bottom:1px solid var(--line);min-height:52px}
.hd .bk{font-size:28px;line-height:1;padding:0 10px 4px 4px;color:#7fa6ff}
.hd .bk.hid{visibility:hidden}
.hd .tt{flex:1;font-weight:650;font-size:17px;text-align:center;margin-right:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:active{background:var(--ui2)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:18px;color:#fff}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:650;display:flex;justify-content:space-between;gap:8px}
.row .nm small{font-weight:400;color:var(--dim);font-size:13px}
.row .pv{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--blue)}
/* thread */
.th{padding:14px 12px 20px;display:flex;flex-direction:column;gap:4px}
.ts{align-self:center;font-size:11.5px;color:#777;margin:12px 0 6px}
.bu{max-width:78%;padding:9px 13px;border-radius:19px;font-size:15.5px;line-height:1.32;animation:buIn .3s ease-out;word-wrap:break-word;white-space:pre-wrap}
@keyframes buIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bu.l{align-self:flex-start;background:var(--ui3);border-bottom-left-radius:6px}
.bu.r{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.cap{font-size:11px;color:#7c7f86;align-self:flex-end;margin:0 6px 6px}
.cap.l{align-self:flex-start}
.bu.ty{display:flex;gap:4px;padding:13px 15px}
.bu.ty i{width:7px;height:7px;border-radius:50%;background:#999;animation:tyd 1.2s infinite}
.bu.ty i:nth-child(2){animation-delay:.15s}.bu.ty i:nth-child(3){animation-delay:.3s}
.bu.r.ty i{background:#cfdcff}
@keyframes tyd{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.tray{flex:none;padding:10px 10px calc(10px + var(--sab));border-top:1px solid var(--line);background:#0b0c0e;display:flex;flex-direction:column;gap:8px;min-height:62px}
.tray .fake{border:1px solid #2c2f35;border-radius:20px;padding:9px 14px;color:#555;font-size:15px}
.chip{border:1.5px solid #3d6fe8;color:#cfe0ff;border-radius:20px;padding:10px 15px;text-align:left;font-size:15px;animation:buIn .35s ease-out backwards;background:rgba(47,107,240,.08)}
.chip:active{background:rgba(47,107,240,.35)}
.chip.dim{border-color:#333;color:#666;background:none}
/* mirror app (light) */
.mir{background:#f7f4fb;color:#1e1b28}
.mir .hd{border-color:#e7e2ef;background:#fff}
.mir .hd .bk{color:#8a72e0}
.mir .body{padding:16px}
.mcard{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(120,90,200,.09)}
.mcard h4{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:#9a88d8;margin-bottom:10px}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.ring .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.ring .k{font-size:13px;color:#7d7889}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0ecf5;font-size:14.5px}
.stat:last-child{border:0}
.stat b{font-variant-numeric:tabular-nums}
.rate{padding:8px 0;border-bottom:1px solid #f0ecf5}
.rate:last-child{border:0}
.rate .st{color:#f5b84a;letter-spacing:2px}
.rate .q{font-size:13px;color:#7d7889;font-style:italic}
.chg{font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#3b3748}
.chg b{color:#8a72e0}
.chg .ki{color:#d24b3c}
.mbtn{display:block;width:100%;padding:15px;border-radius:16px;background:linear-gradient(135deg,#9b85f0,#f29a8c);color:#fff;font-weight:650;font-size:16px;margin-top:6px}
.mbtn.ghost{background:#efeaf7;color:#6b5cad}
/* notes */
.nts{background:#14130f}
.nts .hd{border-color:#2a2720}
.nts .hd .bk{color:#e7b84f}
.note{padding:18px 18px 40px;font-size:16.5px;line-height:1.55;color:#e9e3d3}
.note h2{font-size:24px;margin-bottom:4px}
.note .meta{font-size:12px;color:#857f6e;margin-bottom:18px}
.note p{margin-bottom:14px}
.note .by{color:#a6ecff;font-family:var(--mono);font-size:13.5px;border-top:1px dashed #3a3628;padding-top:14px;margin-top:18px}
/* photos */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pg canvas,.pg .ph{width:100%;aspect-ratio:1;display:block;background:#111}
.alb{padding:16px 14px;font-weight:650;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px}
.alb small{color:var(--dim);font-weight:400}
.sect{padding:16px 14px 8px;font-size:13px;color:var(--dim);letter-spacing:.04em}
.pv1{position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column;animation:scrIn .3s}
.pv1 .stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:900px;padding:16px}
.pv1 .card{width:min(86vw,420px);aspect-ratio:1/1.12;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.8,.3,1)}
.pv1 .card.sq{aspect-ratio:1}
.pv1 .card canvas{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.pv1 .card canvas.back{transform:rotateY(180deg)}
.pv1 .card.flip{transform:rotateY(180deg)}
.pv1 .info{padding:12px 18px calc(18px + var(--sab));font-size:13.5px;color:#aaa;text-align:center;min-height:70px}
.pv1 .info b{color:#eee;display:block;font-size:15px;margin-bottom:3px}
.pv1 .info .warn{color:#ff8e80}
/* call */
.call .top{position:absolute;top:calc(18px + var(--sat));left:0;right:0;text-align:center;z-index:2}
.call .top .n{font-size:26px;font-weight:500}
.call .top .s{font-size:13px;color:#9bd;letter-spacing:.06em;margin-top:3px;font-family:var(--mono)}
.call .pip{position:absolute;right:14px;top:calc(96px + var(--sat));width:84px;height:120px;border-radius:12px;overflow:hidden;border:1px solid #333;z-index:2;background:#050505}
.call .sub{position:absolute;left:16px;right:16px;bottom:calc(150px + var(--sab));text-align:center;font-size:18px;line-height:1.45;color:#f0f0f0;text-shadow:0 2px 8px #000,0 0 2px #000;z-index:2;min-height:3em;font-family:var(--serif)}
.call .ch{position:absolute;left:14px;right:14px;bottom:calc(110px + var(--sab));z-index:3;display:flex;flex-direction:column;gap:8px}
.call .ch .chip{background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:rgba(166,236,255,.5);color:#dff6ff;text-align:center}
.call .btns{position:absolute;bottom:calc(26px + var(--sab));left:0;right:0;display:flex;justify-content:center;gap:70px;z-index:2}
.call .btns button{width:68px;height:68px;border-radius:50%;display:grid;place-items:center}
.call .btns svg{width:30px;height:30px;fill:#fff}
.rbtn{background:#e5413a}.gbtn{background:#2fbf5b}
.ringing .gbtn{animation:wob 1.2s infinite}
/* scan */
.scanbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(40px + var(--sab));z-index:2;text-align:center;pointer-events:none}
.scanbox .pc{font-family:var(--mono);font-size:44px;font-weight:300;letter-spacing:.05em}
.scanbox .lb{font-family:var(--mono);font-size:12px;letter-spacing:.25em;color:#999;margin-top:4px;text-transform:uppercase}
.scanbox .ms{font-size:15px;margin-top:14px;padding:0 30px;min-height:3em;color:#ddd}
/* title */
.ttl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center;padding:24px}
.ttl h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,13vw,72px);letter-spacing:.32em;margin-left:.32em;color:#f3f1ec;text-shadow:3px 0 rgba(255,60,60,.35),-3px 0 rgba(80,220,255,.35)}
.ttl .tg{font-family:var(--mono);font-size:12px;letter-spacing:.28em;color:#8b8e94;margin-top:16px;text-transform:uppercase}
.ttl .warn{font-size:13px;color:#777;margin-top:44px;line-height:1.8;letter-spacing:.04em}
.ttl .begin{margin-top:36px;font-family:var(--mono);font-size:14px;letter-spacing:.4em;padding:16px 26px;border:1px solid #444;animation:pulse 2.2s infinite}
.ttl .cont{margin-top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:#888;padding:10px}
.ttl input{margin-top:26px;background:none;border:0;border-bottom:1px solid #555;color:#fff;font-size:26px;text-align:center;width:min(80vw,320px);padding:8px;font-family:var(--serif);outline:none;border-radius:0}
.ttl .q{font-family:var(--serif);font-style:italic;font-size:21px;color:#ddd}
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;padding:30px;animation:fadeIn 3s}
.endc .en{font-family:var(--mono);font-size:12px;letter-spacing:.35em;color:#888}
.endc h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,9vw,46px);letter-spacing:.12em;margin:14px 0 30px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade{position:absolute;inset:0;background:#000;z-index:57;pointer-events:none;opacity:0;transition:opacity 1.2s}
.fade.on{opacity:1}
.glitch #os,.glitch #cine{animation:gl .12s steps(2) infinite}
@keyframes gl{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-4px,1px) skewX(-2deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,2px) skewX(1.5deg)}}
.bu.ed{animation:edp .45s infinite alternate}
@keyframes edp{to{background:#7d63e0;box-shadow:0 0 18px rgba(169,147,245,.6)}}
.cap.edc{color:#b5a3f0;animation:fadeIn 1.2s}
.setp{position:absolute;inset:0;z-index:4;background:#050506;display:flex;flex-direction:column;padding:calc(18px + var(--sat)) 18px calc(18px + var(--sab));overflow-y:auto;animation:fadeIn .4s}
.setp h3{font-family:var(--mono);font-size:12px;letter-spacing:.35em;color:#888;margin:8px 0 10px;font-weight:400}
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #1d1f23}
.srow .l{flex:1}.srow .l b{display:block;font-weight:600;font-size:16px}.srow .l small{color:#80838a;font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:15px;background:#3a3c42;position:relative;transition:background .25s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(20px)}
.sw.dis{opacity:.35}
.ends{margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#6d7076;line-height:2}
.ends b{color:#bbb;font-weight:400}
.mir .tos{font-family:var(--serif);font-size:13.5px;line-height:1.6;color:#3b3748;padding:18px 18px 60px}
.mir .tos p{margin-bottom:12px}
.mir .tos .me{color:#d24b3c;font-family:var(--mono);font-size:12px;margin:18px 0}
.plan{border-radius:20px;padding:18px;background:#fff;margin-bottom:14px;box-shadow:0 6px 24px rgba(120,90,200,.09);position:relative}
.plan.rec{box-shadow:0 0 0 2px #9b85f0,0 10px 30px rgba(120,90,200,.2)}
.plan .tag{position:absolute;top:-10px;right:14px;background:#9b85f0;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:10px}
.plan h5{font-size:19px}.plan .pr{font-size:15px;color:#8a72e0;font-weight:650;margin:2px 0 8px}
.plan li{font-size:14px;color:#55506a;margin:4px 0 4px 18px}
.msw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0ecf5}
.msw:last-child{border:0}

<body>
<div id="app">
<canvas id="bg"></canvas>
<div id="os">
 <div id="sb"><span id="clock">3:12</span><span class="r"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><span id="bat"><span id="batn">92%</span><svg viewBox="0 0 26 14" style="width:24px"><rect x="1" y="1" width="21" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect id="batf" x="3" y="3" width="16" height="8" rx="1.5"/><rect x="23" y="4.5" width="2" height="5" rx="1"/></svg></span></span></div>
 <div id="scr"></div>
</div>
<div id="cine"></div>
<div id="banner"></div>
<div id="thought"><div class="tx"></div><div class="go">TAP</div></div>
<div class="fade" id="fade"></div>
<canvas id="fx"></canvas>
</div>
<script>
'use strict';
/* ================= AUDIO: everything synthesized, nothing loaded ================= */
const A = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, out, verbIn, noiseB, brownB, shB;
  const L = {}; // running layers
  const api = { speaking: false, mouth: 0, ttsOK: true, haptics: !!navigator.vibrate, voiceOn: true };

  function mkNoise(sec, kind) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0, hold = 0, hv = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
      else if (kind === 'sh') { if (hold-- <= 0) { hold = 20 + Math.random() * 600; hv = Math.random() * 2 - 1; } d[i] = hv; }
      else d[i] = w;
    }
    return b;
  }
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  api.init = () => {
    if (ctx) { api.resume(); return; }
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    out = ctx.createGain(); out.gain.value = 0.85; out.connect(comp); comp.connect(ctx.destination);
    const cv = ctx.createConvolver(); cv.buffer = impulse(3.4, 2.4);
    verbIn = ctx.createGain(); const vr = ctx.createGain(); vr.gain.value = 0.55;
    verbIn.connect(cv); cv.connect(vr); vr.connect(out);
    noiseB = mkNoise(3, 'w'); brownB = mkNoise(6, 'brown'); shB = mkNoise(2, 'sh');
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(out); s.start(0);
    api.resume();
  };
  api.resume = () => { if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); };
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend().catch(() => {}); if (window.speechSynthesis) speechSynthesis.pause(); }
    else { ctx.resume().catch(() => {}); if (window.speechSynthesis) speechSynthesis.resume(); }
  });
  const T = () => ctx.currentTime;
  function g(v) { const n = ctx.createGain(); n.gain.value = v; return n; }
  function send(node, wet, dry = 1) { if (dry) { const d = g(dry); node.connect(d); d.connect(out); } if (wet) { const w = g(wet); node.connect(w); w.connect(verbIn); } }
  function tone(f, dur, o = {}) {
    if (!ctx) return;
    const t = T() + (o.at || 0), os = ctx.createOscillator(), e = g(0);
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.det) os.detune.value = o.det;
    const v = o.vol == null ? 0.2 : o.vol, a = o.a || 0.005;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(v, t + a); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let last = e;
    if (o.lp) { const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; e.connect(f2); last = f2; }
    os.connect(e); send(last, o.rev || 0, o.dry == null ? 1 : o.dry);
    os.start(t); os.stop(t + dur + 0.05);
  }
  function burst(dur, o = {}) {
    if (!ctx) return;
    const t = T() + (o.at || 0), s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), e = g(0);
    s.buffer = o.buf || noiseB; f.type = o.ft || 'lowpass'; f.frequency.value = o.f || 1000; f.Q.value = o.q || 0.7;
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(v, t + (o.a || 0.003)); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(e); send(e, o.rev || 0);
    s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  api.vib = (p) => { if (api.haptics) try { navigator.vibrate(p); } catch (e) {} };

  /* ---- UI sounds ---- */
  api.tap = () => burst(0.02, { ft: 'highpass', f: 2500, vol: 0.07 });
  api.key = () => { tone(1200, 0.05, { vol: 0.05 }); burst(0.015, { ft: 'highpass', f: 3000, vol: 0.05 }); };
  api.type = () => burst(0.025, { ft: 'bandpass', f: 2200 + Math.random() * 800, q: 2, vol: 0.06 });
  api.notify = (bad = 0) => {
    if (!bad) { tone(1318.5, 0.5, { vol: 0.12, rev: 0.25 }); tone(1975.5, 0.7, { vol: 0.1, at: 0.09, rev: 0.3 }); }
    else { const k = 1 - bad * 0.06; tone(1318.5 * k, 0.9, { vol: 0.12, rev: 0.5, det: -30 * bad }); tone(1975.5 * k * 0.97, 1.3, { vol: 0.09, at: 0.16 + bad * 0.05, rev: 0.6, det: -50 * bad }); }
    api.vib([20, 60, 20]);
  };
  api.err = () => { tone(110, 0.12, { type: 'square', vol: 0.06, lp: 600 }); tone(98, 0.16, { type: 'square', vol: 0.06, lp: 600, at: 0.14 }); api.vib([60, 40, 60]); };
  api.unlock = () => { tone(700, 0.25, { to: 1400, vol: 0.08, rev: 0.3 }); tone(2100, 0.6, { vol: 0.04, at: 0.12, rev: 0.5 }); };
  api.open = () => burst(0.18, { ft: 'bandpass', f: 600, fto: 2400, q: 1.2, vol: 0.06 });
  api.sent = () => tone(900, 0.18, { to: 1500, vol: 0.06 });
  api.recv = () => { tone(1046, 0.3, { vol: 0.08, rev: 0.2 }); api.vib(25); };

  /* ---- atmosphere ---- */
  api.room = (on, v = 0.05) => {
    if (!ctx) return;
    if (on && !L.room) {
      const s = ctx.createBufferSource(); s.buffer = brownB; s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; const e = g(0);
      s.connect(f); f.connect(e); e.connect(out); s.start(); e.gain.linearRampToValueAtTime(v, T() + 3);
      L.room = { s, e };
    } else if (!on && L.room) { const r = L.room; r.e.gain.linearRampToValueAtTime(0, T() + 2); setTimeout(() => r.s.stop(), 2200); L.room = null; }
  };
  api.fridge = (on) => {
    if (!ctx) return;
    if (on && !L.fr) {
      const e = g(0), oss = [];
      [[59.7, 0.05], [119.4, 0.03], [179.1, 0.012], [238.8, 0.006]].forEach(([f, v]) => { const o = ctx.createOscillator(); o.frequency.value = f; const gg = g(v); o.connect(gg); gg.connect(e); o.start(); oss.push(o); });
      const lfo = ctx.createOscillator(), lg = g(0.25); lfo.frequency.value = 0.13; lfo.connect(lg); lg.connect(e.gain); lfo.start(); oss.push(lfo);
      e.connect(out); e.gain.linearRampToValueAtTime(0.6, T() + 2); L.fr = { e, oss };
    } else if (!on && L.fr) { const r = L.fr; r.e.gain.cancelScheduledValues(T()); r.e.gain.setValueAtTime(r.e.gain.value, T()); r.e.gain.linearRampToValueAtTime(0, T() + 0.08); setTimeout(() => r.oss.forEach(o => o.stop()), 200); L.fr = null; }
  };
  api.drone = (lvl, tension = 0, sec = 4) => {
    if (!ctx) return;
    if (!L.dr) {
      const e = g(0), f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 3;
      const mk = (fr, type, v, dest) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = fr; const gg = g(v); o.connect(gg); gg.connect(dest); o.start(); return { o, gg }; };
      const a = mk(55, 'sawtooth', 0.14, f), b = mk(55.35, 'sawtooth', 0.14, f), c = mk(110.2, 'sine', 0.05, f);
      const dis = mk(58.27, 'sine', 0, e), hi = mk(1661, 'sine', 0, e);
      const lfo = ctx.createOscillator(), lg = g(60); lfo.frequency.value = 0.07; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      f.connect(e); send(e, 0.6, 1);
      L.dr = { e, f, dis, hi, oss: [a.o, b.o, c.o, dis.o, hi.o, lfo] };
    }
    const d = L.dr, t = T();
    d.e.gain.cancelScheduledValues(t); d.e.gain.setValueAtTime(d.e.gain.value, t); d.e.gain.linearRampToValueAtTime(lvl, t + sec);
    d.f.frequency.cancelScheduledValues(t); d.f.frequency.setValueAtTime(d.f.frequency.value, t); d.f.frequency.linearRampToValueAtTime(160 + tension * 700, t + sec);
    d.dis.gg.gain.linearRampToValueAtTime(tension * 0.16, t + sec);
    d.hi.gg.gain.linearRampToValueAtTime(tension > 0.6 ? (tension - 0.6) * 0.012 : 0, t + sec);
  };
  api.silence = (sec = 0.05) => { // everything ambient drops out (used for shocks)
    api.drone(0, 0, sec); api.fridge(false); api.room(false); api.heart(0);
  };
  let hbT = null, hbBpm = 0;
  api.heart = (bpm) => {
    hbBpm = bpm; if (hbT || !bpm) return;
    const beat = () => {
      if (!hbBpm || !ctx) { hbT = null; return; }
      tone(68, 0.22, { to: 36, vol: 0.5, lp: 160 }); tone(60, 0.2, { to: 34, vol: 0.32, lp: 140, at: 0.24 });
      api.vib([35, 190, 25]);
      hbT = setTimeout(beat, 60000 / hbBpm);
    };
    beat();
  };
  api.sting = (lvl = 1) => {
    if (!ctx) return;
    [73.4, 77.8, 110, 116.5, 155.6, 233].forEach((f, i) => {
      const t = T(), o = ctx.createOscillator(), e = g(0), fl = ctx.createBiquadFilter();
      o.type = i % 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 30;
      fl.type = 'lowpass'; fl.frequency.value = 500 + lvl * 700;
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.07 * lvl, t + 0.6); e.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
      o.connect(fl); fl.connect(e); send(e, 0.9, 0.7); o.start(t); o.stop(t + 4.6);
    });
    tone(36, 2.5, { vol: 0.4 * lvl, a: 0.02 });
  };
  api.glitch = (dur = 0.3, vol = 0.18) => {
    burst(dur, { buf: shB, ft: 'bandpass', f: 400 + Math.random() * 3000, q: 0.8, vol });
    burst(dur * 0.6, { buf: shB, ft: 'highpass', f: 2000, vol: vol * 0.5, at: dur * 0.3 });
  };
  api.creak = () => {
    if (!ctx) return;
    const t = T(), o = ctx.createOscillator(), f = ctx.createBiquadFilter(), e = g(0);
    o.type = 'sawtooth'; const n = 40, c = new Float32Array(n);
    let v = 95; for (let i = 0; i < n; i++) { v += (Math.random() - 0.45) * 14; c[i] = Math.max(50, v); }
    o.frequency.setValueCurveAtTime(c, t, 0.9);
    f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 6;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.35, t + 0.1); e.gain.linearRampToValueAtTime(0.25, t + 0.6); e.gain.linearRampToValueAtTime(0, t + 0.9);
    o.connect(f); f.connect(e); send(e, 0.5); o.start(t); o.stop(t + 1);
  };
  api.step = (v = 1) => { burst(0.14, { f: 170, vol: 0.45 * v, rev: 0.15 }); burst(0.03, { ft: 'bandpass', f: 900, q: 1, vol: 0.05 * v, at: 0.02 }); };
  api.door = () => { api.creak(); setTimeout(api.creak, 450); burst(0.5, { f: 120, vol: 0.4, at: 1.1, rev: 0.4 }); };
  api.whoosh = () => burst(0.9, { ft: 'bandpass', f: 300, fto: 3000, q: 0.6, vol: 0.1, a: 0.3 });

  /* ---- ringtone: yours. Later, slightly wrong. ---- */
  api.ring = (wrong = 0) => {
    if (!ctx) return () => {};
    let on = true, i = 0;
    const notes = [659.3, 830.6, 987.8, 830.6, 659.3, 987.8, 1318.5, 987.8];
    const step = () => {
      if (!on) return;
      const f = notes[i % notes.length] * (1 - wrong * 0.015 * (i % 3));
      tone(f, 0.45, { vol: 0.13, rev: 0.25 }); tone(f * 4, 0.12, { vol: 0.03 });
      if (i % 8 === 0) api.vib([400, 200, 400]);
      i++; setTimeout(step, i % 8 === 0 ? 900 + wrong * 300 : 150 + wrong * 40);
    };
    step();
    return () => { on = false; api.vib(0); };
  };

  /* ---- the voice: speech synthesis with a second murmur underneath ---- */
  let voice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices() || [];
    const en = vs.filter(v => /^en/i.test(v.lang));
    voice = en.find(v => v.localService && /US|United States/i.test(v.lang + v.name)) || en.find(v => v.localService) || en[0] || vs[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { speechSynthesis.onvoiceschanged = pickVoice; } }
  api.warmTTS = () => { try { if (!window.speechSynthesis) { api.ttsOK = false; return; } const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { api.ttsOK = false; } };

  function murmur(dur, vol) {
    if (!ctx) return;
    const t0 = T(), o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 102;
    const vib = ctx.createOscillator(), vg = g(3); vib.frequency.value = 5.5; vib.connect(vg); vg.connect(o.frequency); vib.start(t0);
    const e = g(0), F = [[700, 1200], [300, 2300], [500, 1000], [400, 2000], [600, 1700], [350, 900]];
    const b1 = ctx.createBiquadFilter(), b2 = ctx.createBiquadFilter(); b1.type = b2.type = 'bandpass'; b1.Q.value = 9; b2.Q.value = 12;
    o.connect(b1); o.connect(b2); b1.connect(e); b2.connect(e);
    let t = t0;
    while (t < t0 + dur) {
      const syl = 0.11 + Math.random() * 0.14, f = F[Math.floor(Math.random() * F.length)];
      b1.frequency.setValueAtTime(f[0], t); b2.frequency.setValueAtTime(f[1], t);
      e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(vol, t + syl * 0.3); e.gain.linearRampToValueAtTime(vol * 0.2, t + syl);
      t += syl + (Math.random() < 0.15 ? 0.18 : 0.02);
    }
    e.gain.linearRampToValueAtTime(0, t + 0.1);
    send(e, 0.8, 0.6); o.start(t0); o.stop(t + 0.2); vib.stop(t + 0.2);
  }
  api.speak = (text, o = {}) => new Promise(res => {
    const words = text.split(/\s+/).length, est = 900 + words * 330;
    let done = false, started = false;
    const fin = () => { if (done) return; done = true; api.speaking = false; res(); };
    api.speaking = true;
    if (!api.voiceOn) { setTimeout(fin, est + 600); return; }
    murmur(est / 1000, api.ttsOK ? (o.murmur ?? 0.025) : 0.09);
    if (!api.ttsOK || !window.speechSynthesis || o.mute) { setTimeout(fin, est + 400); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[—…]/g, ', '));
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = o.rate || 0.92; u.pitch = o.pitch || 0.82; u.volume = o.vol == null ? 1 : o.vol;
      u.onstart = () => { started = true; };
      u.onend = () => setTimeout(fin, 250);
      u.onerror = () => setTimeout(fin, Math.max(300, est - 500));
      u.onboundary = () => { api.mouth = 1; };
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !done) { api.ttsOK = false; } }, 3000);
      setTimeout(() => { if (!started) fin(); }, est + 1500);
      setTimeout(fin, est * 2.2 + 4000);
    } catch (e) { api.ttsOK = false; setTimeout(fin, est); }
  });
  api.check = () => { api.drone(0.2, 0.1, 1.5); setTimeout(() => api.heart(60), 300); setTimeout(() => { api.heart(0); api.drone(0, 0, 2); }, 3200); tone(220, 1.6, { vol: 0.12, rev: 0.5, a: 0.3 }); tone(277, 1.6, { vol: 0.08, rev: 0.5, a: 0.3, at: 0.2 }); };
  api.hush = () => { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} api.speaking = false; };
  return api;
})();

/* ================= GFX 1: overlay grain/glitch + the face ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a = 1, b) => b == null ? Math.random() * a : a + Math.random() * (b - a);
function fitCanvas(c, cap = 2) {
  const d = Math.min(window.devicePixelRatio || 1, cap), r = c.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return d;
}

const FX = (() => {
  const c = document.getElementById('fx'), x = c.getContext('2d');
  const tile = document.createElement('canvas'); tile.width = tile.height = 128;
  { const t = tile.getContext('2d'), im = t.createImageData(128, 128);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    t.putImageData(im, 0, 0); }
  let pat = null, W = 0, H = 0;
  const st = { calm: false, grain: 0.06, vig: 0.5, red: 0, glUntil: 0, glAmt: 0, flick: 0, dark: 0 };
  function size() { W = c.width = Math.ceil(innerWidth / 2); H = c.height = Math.ceil(innerHeight / 2); pat = x.createPattern(tile, 'repeat'); }
  size(); addEventListener('resize', size);
  const app = document.getElementById('app');
  function loop(now) {
    x.clearRect(0, 0, W, H);
    if (st.dark > 0) { x.fillStyle = `rgba(0,0,0,${st.dark})`; x.fillRect(0, 0, W, H); }
    if (st.red > 0) { x.fillStyle = `rgba(120,0,0,${st.red})`; x.fillRect(0, 0, W, H); }
    x.save(); x.globalAlpha = st.grain; x.globalCompositeOperation = 'overlay';
    x.translate(-rnd(128), -rnd(128)); x.fillStyle = pat; x.fillRect(0, 0, W + 128, H + 128); x.restore();
    const gr = x.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);

  subEl = h('div', { cls: 'sub', style: subStyle }); c.append(subEl);
  await line('Or.', { gap: 900 });
  await line("There's another way. Come in here, with me. We'd be one thing. I'd keep the good parts. You'd never be tired again.");
  subEl.textContent = '';
  const end = await finalChoice(c);
  removeEventListener('resize', onR);
  const set = g => { glow = g; drawRoom(cv, glow); };
  await ({ A: endA, B: endB, C: endC, D: endD })[end](c, tf, ph, set);
}
function finalChoice(c) {
  return new Promise(res => {
    const box = h('div', { cls: 'ch', style: 'position:absolute;left:14px;right:14px;bottom:calc(36px + var(--sab));display:flex;flex-direction:column;gap:9px;z-index:3;transition:opacity 26s linear' });
    const opts = [['Choose, Jo.', 'A'], ["I'm deleting it.", 'B'], ['Let it take me.', 'C']];
    let done = false; const fin = k => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); box.remove(); res(k); };
    opts.forEach(([t, k], i) => box.append(h('button', { cls: 'chip', style: `animation-delay:${i * 120}ms;text-align:center;background:rgba(0,0,0,.55);border-color:rgba(166,236,255,.45);color:#dff6ff`, onclick: () => { A.tap(); fin(k); } }, t)));
    c.append(box);
    setTimeout(() => { box.style.opacity = 0.12; }, 1500);
    A.heart(60);
    const t1 = setTimeout(() => { if (!done) { muse("You're doing it. Going away somewhere.", 5000); A.heart(52); } }, 13000);
    const t2 = setTimeout(() => fin('D'), 28000);
  });
}
async function changelog(c, html) {
  const card = h('div', { style: 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,380px);background:#fff;color:#1e1b28;border-radius:22px;padding:22px;box-shadow:0 0 80px rgba(180,160,255,.35);animation:fadeIn 1.5s;z-index:4' },
    h('div', { style: 'font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:#9a88d8;margin-bottom:10px;font-weight:700' }, "Mirror · What's new"), h('div', { cls: 'chg', html: N(html) }));
  c.append(card); A.notify(); await wait(1200); await think(' '); card.remove();
}
let ended = false;
async function endCard(n, name) {
  if (ended) return; ended = true; wipe();
  if (!META.endings.includes(n)) META.endings.push(n); META.name = S.name; META.last = Date.now(); saveMeta();
  A.silence(1.5); A.hush();
  await fade(true, 1800); const c = cine.open(); await fade(false, 10);
  c.append(h('div', { cls: 'endc' }, h('div', { cls: 'en' }, `ENDING ${n} OF 4`), h('h2', {}, name),
    h('div', { cls: 'en', style: 'margin:-12px 0 34px;font-size:10.5px;color:#666' }, `YOU HAVE FOUND ${META.endings.length} OF 4`),
    h('button', { cls: 'begin', style: 'font-family:var(--mono);font-size:13px;letter-spacing:.35em;padding:14px 22px;border:1px solid #444', onclick: () => location.reload() }, 'BEGIN AGAIN')));
  setTimeout(() => banner('mir', '{N2}', "It's okay, {N}. We can try again tomorrow.", { ms: 7000, bad: 1 }), 60000);
  await new Promise(() => {});
}

  await scanSeq([{ to: 49, broken: 0.75, msg: "We don't recognize you." }, { to: 31, broken: 0.95, msg: 'The account holder is already signed in, on another device. Smiling.', hold: 3600 }]);

/* ---- ending 3: Merged ---- */

  if (S.said.call === 0) await line('You told me no, earlier. I understood. You meant later.', { gap: 900 });
